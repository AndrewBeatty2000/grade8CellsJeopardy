<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Grade 8 Science Jeopardy – Cells</title>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #0b1c3d;
        color: white;
        text-align: center;
    }
    h1 { margin: 20px; }
    table {
        margin: auto;
        border-collapse: collapse;
    }
    th, td {
        border: 2px solid white;
        padding: 20px;
        width: 160px;
        height: 90px;
        font-size: 20px;
        cursor: pointer;
        background-color: #1f3a6d;
    }
    th {
        background-color: #10264d;
        font-size: 18px;
    }
    td.used {
        background-color: #333;
        cursor: default;
    }
    #questionBox {
        margin-top: 30px;
        padding: 20px;
        width: 75%;
        margin-left: auto;
        margin-right: auto;
        background-color: #1f3a6d;
        border: 2px solid white;
        font-size: 22px;
        min-height: 120px;
    }
    button {
        margin: 10px;
        padding: 10px 20px;
        font-size: 16px;
        cursor: pointer;
    }
</style>
</head>

<body>

<h1>🔬 Grade 8 Science Jeopardy<br>Cells & Cellular Processes</h1>

<table>
<tr>
    <th>Cell Theory</th>
    <th>Microscopes</th>
    <th>Organelles</th>
    <th>Plant vs. Animal</th>
    <th>Cellular Transport</th>
</tr>

<tr>
<td onclick="showQA(this,'What is the basic structural unit of an organism and building block of life?','The cell.')">$100</td>
<td onclick="showQA(this,'Which lens do you look into on a compound light microscope?','The eyepiece (ocular lens).')">$100</td>
<td onclick="showQA(this,'Which large organelle controls activities of the cell such as growth?','The nucleus.')">$100</td>
<td onclick="showQA(this,'Which rigid structure surrounds the cell membrane in plant cells but is absent in animal cells?','The cell wall.')">$100</td>
<td onclick="showQA(this,'What term describes a membrane that allows only certain substances to pass through it?','Selectively permeable.')">$100</td>
</tr>

<tr>
<td onclick="showQA(this,'Who built one of the first successful light microscopes and observed bacteria and blood cells?','Antony van Leeuwenhoek.')">$200</td>
<td onclick="showQA(this,'Which knob should you use first to bring a specimen into focus?','The coarse adjustment knob.')">$200</td>
<td onclick="showQA(this,'Which organelles are called the powerhouses of the cell that release stored energy?','Mitochondria.')">$200</td>
<td onclick="showQA(this,'Which membrane-bound organelles containing chlorophyll are found in plant cells but not animal cells?','Chloroplasts.')">$200</td>
<td onclick="showQA(this,'What process describes the movement of particles from high to low concentration?','Diffusion.')">$200</td>
</tr>

<tr>
<td onclick="showQA(this,'State one key idea of the Cell Theory.','Answers include: The cell is the basic unit of life; all organisms are made of one or more cells; or all cells come from pre-existing cells.')">$300</td>
<td onclick="showQA(this,'Where do you place a microscope slide for observation?','On the stage.')">$300</td>
<td onclick="showQA(this,'What jelly-like material fills the cell and surrounds all organelles?','Cytoplasm.')">$300</td>
<td onclick="showQA(this,'How do the size and number of vacuoles differ between plant and animal cells?','Plant cells have one large vacuole, while animal cells have several small vacuoles.')">$300</td>
<td onclick="showQA(this,'What is osmosis?','The movement of water through a selectively permeable membrane.')">$300</td>
</tr>

<tr>
<td onclick="showQA(this,'How are new cells created according to cell theory?','From existing cells through cell division.')">$400</td>
<td onclick="showQA(this,'Which part of the microscope controls the amount of light passing through the specimen?','The diaphragm.')">$400</td>
<td onclick="showQA(this,'Which organelles are responsible for making proteins in the cell?','Ribosomes.')">$400</td>
<td onclick="showQA(this,'Why are stains like methylene blue or iodine used when viewing cells under a microscope?','To create contrast and make transparent cells/organelles visible.')">$400</td>
<td onclick="showQA(this,'Why does a plant wilt when it lacks water?','Water leaves the cell vacuoles by osmosis, causing the cells to shrink and lose rigidity.')">$400</td>
</tr>

<tr>
<td onclick="showQA(this,'What is the difference between a unicellular and a multicellular organism?','Unicellular organisms consist of a single cell; multicellular organisms are made of many cells.')">$500</td>
<td onclick="showQA(this,'Why should you only use the fine adjustment knob when focusing under high power?','To prevent moving the stage up too far and crashing the high-power objective lens into the slide.')">$500</td>
<td onclick="showQA(this,'Which organelle combines proteins and delivers them to the rest of the cell or outside the cell?','The Golgi apparatus.')">$500</td>
<td onclick="showQA(this,'When observing living or moving objects under a microscope, which slide preparation method is used?','A wet mount.')">$500</td>
<td onclick="showQA(this,'How does reverse osmosis differ from regular osmosis?','High pressure forces water to move from low water concentration to high water concentration across a membrane.')">$500</td>
</tr>
</table>

<div id="questionBox">
Click a dollar amount to reveal a question.
</div>

<button onclick="showAnswer()">Show Answer</button>
<button onclick="clearBox()">Clear</button>

<script>
let currentAnswer = "";

function showQA(cell, question, answer) {
    if (cell.classList.contains("used")) return;
    document.getElementById("questionBox").innerText = question;
    currentAnswer = answer;
    cell.classList.add("used");
}

function showAnswer() {
    if (currentAnswer !== "") {
        document.getElementById("questionBox").innerText += "\n\nAnswer: " + currentAnswer;
    }
}

function clearBox() {
    document.getElementById("questionBox").innerText = "Click a dollar amount to reveal a question.";
    currentAnswer = "";
}
</script>

</body>
</html>
